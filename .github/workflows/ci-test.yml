name: Run CI tests

on:
  push:
    branches:
      - main
      - master
      - dev
      - wip
  pull_request:
  workflow_call:

env:
  FORCE_COLOR: "3"

jobs:
  build:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'macos-latest', 'windows-latest']

    steps:
    - name: "checkout repository"
      uses: actions/checkout@v5

    - name: "setup python 3.12"
      uses: actions/setup-python@v6
      with:
        python-version: 3.12
  
    - name: install nox
      run: python -m pip install nox

    - name: run tests
      run: nox -s lint_pylint typecheck test
